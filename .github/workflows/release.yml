name: Release

on:
  push:
    tags:
      - "v*"

# Needs write access: the job uploads release assets AND commits the regenerated
# appcast.xml back to main.
permissions:
  contents: write

jobs:
  release:
    # macos-26 (Xcode 26.x), NOT macos-15 — `FlipOff/Resources/AppIcon.icon` is an
    # Icon Composer bundle, a macOS 26 / Xcode 26 format. Xcode 16 on macos-15 does
    # not recognize it: instead of compiling it into AppIcon.icns it silently
    # *copies* it into Resources as an inert folder and sets no CFBundleIconFile /
    # CFBundleIconName, so v1.2.0 and earlier shipped with no icon at all. The CI
    # log tell is `Copying AppIcon.icon` where it should read `Compiling`.
    runs-on: macos-26

    steps:
      - name: Checkout
        # Check out main (not the detached tag) so the appcast commit at the end has
        # a branch to land on. The tag points into main's history, so the built code
        # is identical.
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      # ── Fail fast on missing release notes ──────────────────────────────
      # Before the build, not after: the build takes minutes, and a tag with no
      # changelog section is a mistake worth catching in seconds. Also means the
      # notes are known good long before the Release is created, so a bad tag
      # never publishes a half-finished release.
      - name: Verify changelog entry
        run: |
          set -euo pipefail
          echo "── Release notes for ${{ github.ref_name }} ──"
          python3 scripts/changelog-notes.py \
            --version "${{ github.ref_name }}" --format markdown

      - name: Install dependencies
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      # ── Build without Apple signing ─────────────────────────────────────
      # Build unsigned on purpose: the Team-ID automatic signing in project.yml
      # can't resolve on a runner, and xcodebuild would need the identity in the
      # default keychain before the "Import signing identity" step has made one.
      # The bundle is signed as a whole in that later step instead — which is what
      # TCC keys on, and is not Gatekeeper, which still warns on first open. Update
      # integrity does not depend on Apple signing either way: Sparkle verifies the
      # EdDSA signature below against SUPublicEDKey in Info.plist and refuses
      # anything that doesn't match.
      - name: Build release (no Apple identity)
        run: |
          set -o pipefail
          xcodebuild -project FlipOff.xcodeproj \
            -scheme FlipOff \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | xcbeautify

      # ── Verify the app icon actually compiled ───────────────────────────
      # Guard, not a nicety: a runner without Xcode 26 copies AppIcon.icon in as an
      # inert folder rather than compiling it, and the build still *succeeds* — the
      # app just has no icon anywhere. That shipped in v1.2.0 unnoticed. Fail the
      # release instead of publishing an iconless build.
      - name: Verify app icon
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release/FlipOff.app"

          if [ ! -f "$APP_PATH/Contents/Resources/AppIcon.icns" ]; then
            echo "::error::AppIcon.icns missing — AppIcon.icon was not compiled."
            echo "::error::This runner's Xcode is too old for the Icon Composer format."
            echo "::error::Xcode in use: $(xcodebuild -version | tr '\n' ' ')"
            ls -la "$APP_PATH/Contents/Resources/" || true
            exit 1
          fi

          # The .icns alone isn't enough — without the plist key the Finder and Dock
          # never look for it.
          ICON_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" \
            "$APP_PATH/Contents/Info.plist" 2>/dev/null || true)
          if [ -z "$ICON_NAME" ]; then
            echo "::error::CFBundleIconName is not set in the built Info.plist."
            exit 1
          fi

          # The raw Icon Composer source has no business in the shipped bundle; its
          # presence means the asset-catalog step fell back to a plain copy.
          if [ -e "$APP_PATH/Contents/Resources/AppIcon.icon" ]; then
            echo "::error::Uncompiled AppIcon.icon was copied into Resources."
            exit 1
          fi

          echo "Icon OK — AppIcon.icns present, CFBundleIconName=${ICON_NAME}"

      # ── Import the signing identity ─────────────────────────────────────
      # Why this exists: an ad-hoc signature has no certificate, so codesign gives
      # the bundle a designated requirement that is literally `cdhash H"…"` — a
      # pin to that exact build. TCC stores that requirement verbatim in its csreq
      # column, so the *next* release, whose cdhash differs by construction, no
      # longer satisfies the grant. System Settings keeps showing the checkbox on
      # (auth_value stays 2) while tccd denies every request, and toggling the
      # checkbox only rewrites auth_value, never the pinned csreq — so the grant
      # cannot be repaired from the UI at all. That is the v1.5.0 bug report.
      #
      # Signing with a real certificate replaces that pin with
      #   identifier "in.pooya.flipoff" and anchor apple generic
      #     and certificate leaf[subject.CN] = "Apple Development: …"
      # which contains no cdhash and therefore holds across every future build.
      # An Apple Development cert is enough for this; Developer ID is only needed
      # for Gatekeeper/notarization, which these builds still skip.
      #
      # Falls back to ad-hoc when the secret is absent so a fork or a secretless
      # run still produces a working (if cdhash-pinned) bundle.
      - name: Import signing identity
        id: signing
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${SIGNING_CERTIFICATE_P12:-}" ]; then
            echo "::warning::SIGNING_CERTIFICATE_P12 is not set — signing ad-hoc."
            echo "::warning::TCC grants will reset on this update (see step comment)."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock timeout: the default 5min lock can land mid-build and turn
          # codesign into a hang waiting on a prompt nobody can answer.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT_PATH" -k "$KEYCHAIN" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"

          # Without an explicit partition list, codesign's first use of the key
          # raises the interactive "allow access" dialog, which on a runner means
          # the job blocks until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # codesign only searches the keychain *list*, not arbitrary files.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # Match by SHA-1 rather than common name: unambiguous, and immune to the
          # cert's CN changing when it is renewed.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/[0-9A-F]{40}/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No codesigning identity found in the imported .p12."
            security find-identity -v "$KEYCHAIN" || true
            exit 1
          fi

          echo "Imported identity: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      # ── Sign the bundle ─────────────────────────────────────────────────
      # CODE_SIGNING_ALLOWED=NO leaves only a *linker* signature on the executable:
      # `codesign -dv` reports "Sealed Resources=none" and "Info.plist=not bound",
      # i.e. the bundle itself is unsigned. TCC has no identity to hang a grant on
      # in that state, so Accessibility never sticks — the user grants it, relaunches,
      # and the app still reports untrusted. That was the v1.2.0 bug. Signing the
      # bundle here seals its resources and binds Info.plist, so SUPublicEDKey can't
      # be swapped either.
      #
      # This is still not Developer ID: Gatekeeper warns on first open regardless.
      - name: Sign bundle
        env:
          SIGN_ID: ${{ steps.signing.outputs.identity }}
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release/FlipOff.app"
          SIGN_ID="${SIGN_ID:--}"

          # NO `--options runtime` anywhere here. Hardened runtime turns on Library
          # Validation, which requires every loaded library to share the main
          # binary's Team ID — and ad-hoc signatures have no Team ID at all. The app
          # then dies at launch before any code runs:
          #   Library not loaded: @rpath/Sparkle.framework/Versions/B/Sparkle
          #   … mapping process and mapped file (non-platform) have different Team IDs
          # v1.2.1 and v1.2.2 both shipped that way and could not start. Locally this
          # never reproduces: Xcode signs app *and* Sparkle with the same real Team
          # ID, so validation passes and hardened runtime is fine there (project.yml
          # keeps ENABLE_HARDENED_RUNTIME: YES for exactly that path). Hardened
          # runtime buys nothing here anyway — it's a notarization requirement, and
          # these builds are not notarized. (With a real certificate the Team IDs
          # do now match, so Library Validation would pass — but leaving it off
          # keeps the ad-hoc fallback path behaving identically, so don't turn it
          # on without making it conditional on SIGN_ID.)
          #
          # Inside-out, deepest first: Sparkle ships nested helpers (Updater.app,
          # XPC services, Autoupdate) that must be sealed before the framework that
          # contains them, and the frameworks before the app. `--deep` would do this
          # in one shot but is deprecated and would also stamp the app's entitlements
          # onto every nested binary.
          if [ -d "$APP_PATH/Contents/Frameworks" ]; then
            while IFS= read -r item; do
              echo "Signing nested: ${item#"$APP_PATH/"}"
              codesign --force --sign "$SIGN_ID" --timestamp=none "$item"
            # -type d skips the compatibility symlinks at the framework root
            # (Updater.app → Versions/Current/Updater.app and friends); signing
            # through those would sign the same bundle twice.
            done < <(find "$APP_PATH/Contents/Frameworks" -depth -type d \
              \( -name "*.framework" -o -name "*.app" -o -name "*.xpc" \))
          fi

          # Entitlements are applied only to the main executable, not the nested code.
          codesign --force --sign "$SIGN_ID" --timestamp=none \
            --entitlements FlipOff/FlipOff.entitlements \
            "$APP_PATH"

          # Belt and braces: the runtime flag must not be set on the result.
          if codesign -d --verbose=2 "$APP_PATH" 2>&1 | grep -q "runtime"; then
            echo "::error::Hardened runtime is set on this signature — the app will"
            echo "::error::fail to load Sparkle.framework at launch (Library Validation)."
            exit 1
          fi

          # Fail loudly rather than shipping a bundle whose seal doesn't verify.
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          echo "── Resulting signature ──"
          codesign -dv "$APP_PATH" 2>&1

          # The two markers that were wrong in v1.2.0. Checked explicitly so a
          # regression here fails the release instead of shipping quietly.
          SIG_INFO=$(codesign -dv "$APP_PATH" 2>&1)
          if echo "$SIG_INFO" | grep -q "Sealed Resources=none"; then
            echo "::error::Bundle resources were not sealed — TCC grants will not persist."
            exit 1
          fi
          if echo "$SIG_INFO" | grep -q "Info.plist=not bound"; then
            echo "::error::Info.plist is not bound to the signature."
            exit 1
          fi

          # The whole point of signing with a certificate: the designated
          # requirement must NOT be a cdhash pin, or TCC grants break again on the
          # next release exactly as they did in v1.5.0.
          if [ "$SIGN_ID" != "-" ]; then
            REQ="$(codesign -d -r- "$APP_PATH" 2>&1 | grep '^designated' || true)"
            echo "── Designated requirement ──"
            echo "$REQ"
            if echo "$REQ" | grep -q "cdhash"; then
              echo "::error::Designated requirement is still pinned to a cdhash —"
              echo "::error::TCC grants will not survive the next update."
              exit 1
            fi
            if ! echo "$REQ" | grep -q 'identifier "in.pooya.flipoff"'; then
              echo "::error::Designated requirement does not bind the bundle id."
              exit 1
            fi
          fi

      # ── Smoke test: does the signed app actually start? ─────────────────
      # The gap that let v1.2.1/v1.2.2 ship dead: every check above inspects the
      # signature but none of them *run* the binary, and a Library Validation
      # failure kills the process in dyld before main(). Launch it for real and
      # require it to still be alive a few seconds later.
      - name: Smoke test launch
        run: |
          set -uo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release/FlipOff.app"
          LOG="$RUNNER_TEMP/launch.log"

          # LSUIElement app with no Dock tile — run the executable directly and
          # background it rather than going through `open`, so its dyld errors land
          # on our stderr instead of in the window server's lap.
          "$APP_PATH/Contents/MacOS/FlipOff" >"$LOG" 2>&1 &
          APP_PID=$!
          sleep 8

          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::App exited within 8s of launch — it does not start."
            echo "──── output ────"
            cat "$LOG" || true
            exit 1
          fi

          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true

          # dyld reports a failed load here even when something else keeps the
          # process alive, so check the log independently of the liveness test.
          if grep -qE "Library not loaded|different Team IDs|code signature.*not valid" "$LOG"; then
            echo "::error::dyld refused to load an embedded library:"
            cat "$LOG"
            exit 1
          fi

          echo "Launch OK — process survived 8s with no dyld errors."
          cat "$LOG" || true

      - name: Package zip
        id: package
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release/FlipOff.app"
          TAG="${GITHUB_REF#refs/tags/}"
          ZIP_NAME="FlipOff-${TAG}.zip"

          test -d "$APP_PATH" || { echo "::error::$APP_PATH not found"; exit 1; }

          mkdir -p build/dist
          # ditto --keepParent preserves the .app bundle structure and resource forks;
          # `zip -r` would mangle symlinks inside Sparkle.framework.
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "build/dist/${ZIP_NAME}"

          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")
          BUILD_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Contents/Info.plist")
          MIN_SYSTEM=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP_PATH/Contents/Info.plist")

          {
            echo "tag=${TAG}"
            echo "zip_name=${ZIP_NAME}"
            echo "zip_path=build/dist/${ZIP_NAME}"
            echo "short_version=${SHORT_VERSION}"
            echo "build_version=${BUILD_VERSION}"
            echo "min_system=${MIN_SYSTEM}"
            echo "length=$(stat -f%z "build/dist/${ZIP_NAME}")"
          } >> "$GITHUB_OUTPUT"

      # ── Sign the update for Sparkle ─────────────────────────────────────
      # SPARKLE_PRIVATE_KEY is the base64 EdDSA private key printed by
      # `generate_keys -x`. Without it the job fails loudly rather than publishing an
      # update the app would silently reject.
      - name: Sign update (EdDSA)
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SPARKLE_PRIVATE_KEY}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set — cannot sign the update."
            echo "::error::Add it with: gh secret set SPARKLE_PRIVATE_KEY"
            exit 1
          fi

          # Search only the derivedDataPath this job built into. A `find` over a
          # nonexistent ~/Library/.../DerivedData exits non-zero and, under
          # `set -e`, kills the step before the guard below can report anything —
          # which is exactly how this failed the first time. `|| true` keeps the
          # guard reachable so a genuine miss produces a readable error.
          #
          # -path filters to the prebuilt artifacts/…/bin tool: the same tree also
          # contains bin/old_dsa_scripts/sign_update, the deprecated DSA signer, and
          # an unfiltered `head -1` can pick that one and emit a signature Sparkle
          # will reject against SUPublicEDKey.
          SIGN_UPDATE=$(find build/DerivedData/SourcePackages/artifacts \
            -path '*/Sparkle/bin/sign_update' -type f 2>/dev/null | head -1 || true)

          if [ -z "${SIGN_UPDATE}" ]; then
            echo "::error::sign_update not found under build/DerivedData/SourcePackages."
            echo "::error::Sparkle's binary tools ship in the package artifacts; check that"
            echo "::error::the Sparkle dependency resolved during the build step."
            find build/DerivedData/SourcePackages -maxdepth 3 -type d 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "Using sign_update at: ${SIGN_UPDATE}"

          # --ed-key-file reads the key from disk instead of the (absent) CI keychain,
          # and keeps it out of the process list. printf, not echo, so no trailing
          # newline is appended to the key material.
          KEY_FILE="$RUNNER_TEMP/sparkle_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT

          # sign_update prints: sparkle:edSignature="…" length="…"
          SIG_OUTPUT=$("$SIGN_UPDATE" "${{ steps.package.outputs.zip_path }}" --ed-key-file "$KEY_FILE")
          echo "Signature line: $SIG_OUTPUT"

          ED_SIG=$(echo "$SIG_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          if [ -z "$ED_SIG" ]; then
            echo "::error::Failed to parse edSignature from sign_update output"
            exit 1
          fi
          echo "ed_signature=${ED_SIG}" >> "$GITHUB_OUTPUT"

      # ── Publish the GitHub Release ──────────────────────────────────────
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.package.outputs.tag }}"

          # --generate-notes would produce a bare "Full Changelog" compare link,
          # which is also what used to end up in Sparkle's update window. Use the
          # hand-written changelog section for both instead.
          python3 scripts/changelog-notes.py \
            --version "${{ steps.package.outputs.short_version }}" \
            --format markdown > "$RUNNER_TEMP/notes.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

          gh release upload "$TAG" \
            "${{ steps.package.outputs.zip_path }}#${{ steps.package.outputs.zip_name }}" \
            --clobber

      # ── Regenerate and commit the appcast ───────────────────────────────
      # The feed is served from raw.githubusercontent.com off main, so publishing an
      # update means committing this file. Generation lives in scripts/update-appcast.py
      # (XML templating inline in an indented YAML `run:` block is a heredoc trap).
      - name: Update appcast.xml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.package.outputs.tag }}"

          # HTML, not markdown: Sparkle renders <description> as HTML, so raw
          # markdown reaches the user as literal asterisks and dashes.
          NOTES=$(python3 scripts/changelog-notes.py \
            --version "${{ steps.package.outputs.short_version }}" \
            --format html)

          python3 scripts/update-appcast.py \
            --tag "$TAG" \
            --short-version "${{ steps.package.outputs.short_version }}" \
            --build-version "${{ steps.package.outputs.build_version }}" \
            --min-system "${{ steps.package.outputs.min_system }}" \
            --zip-name "${{ steps.package.outputs.zip_name }}" \
            --length "${{ steps.package.outputs.length }}" \
            --signature "${{ steps.sign.outputs.ed_signature }}" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "$NOTES"

          echo "── appcast.xml ──"
          cat appcast.xml

      - name: Commit appcast
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet appcast.xml 2>/dev/null && git ls-files --error-unmatch appcast.xml >/dev/null 2>&1; then
            echo "appcast.xml unchanged — nothing to commit."
            exit 0
          fi

          git add appcast.xml
          git commit -m "Update appcast for ${{ steps.package.outputs.tag }}"

          # main can move while the build runs (it takes minutes). A plain push would
          # be rejected and the release would ship with no feed entry — an update
          # nobody is ever offered. Rebase onto whatever landed and retry.
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "appcast pushed."
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase origin main
          done

          echo "::error::Could not push appcast.xml after 3 attempts."
          echo "::error::The release asset is uploaded but the feed was NOT updated —"
          echo "::error::no client will be offered ${{ steps.package.outputs.tag }} until appcast.xml lands on main."
          exit 1
